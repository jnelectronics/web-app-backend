services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  worker:
    build: .
    command: rq worker --url ${REDIS_URL:-redis://redis:6379/0}
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jn_user
      POSTGRES_PASSWORD: jn_password
      POSTGRES_DB: jn_electronics
    ports:
      - "5432:5432"
    volumes:
      - jn_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  jn_postgres_data:
