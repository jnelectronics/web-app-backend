<div style="background-color: #f4f4f4; padding: 32px 16px; font-family: Arial, Helvetica, sans-serif;">
  <div style="max-width: 480px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; padding: 32px; text-align: center;">

    <img
      src="https://res.cloudinary.com/madwlqbh/image/upload/w_240,q_auto/v1788073700/jn_electronics/branding/email_logo_png.png"
      alt="JN Electronics"
      width="160"
      style="margin-bottom: 24px;"
    />

    <div style="width: 56px; height: 56px; line-height: 56px; border-radius: 50%; background-color: #f5821f; color: #ffffff; font-size: 28px; font-weight: bold; margin: 0 auto 24px auto;">
      &#10003;
    </div>

    <h1 style="color: #1a1a1a; font-size: 20px; margin: 0 0 16px 0;">Your Order Has Been Delivered</h1>

    <p style="color: #444444; font-size: 15px; line-height: 1.5; margin: 0 0 24px 0; text-align: left;">
      Hi {{ full_name }}, order <strong>{{ order_number }}</strong> has been delivered. We hope you're happy with it!
    </p>

    <p style="text-align: center; margin: 0 0 24px 0;">
      <a href="{{ rating_url }}" style="display: inline-block; background-color: #f5821f; color: #ffffff; text-decoration: none; font-weight: bold; font-size: 14px; padding: 12px 24px; border-radius: 6px;">Rate your experience</a>
    </p>

    <p style="color: #aaaaaa; font-size: 12px; line-height: 1.5; margin: 0;">
      Thanks for shopping with JN Electronics.
    </p>

  </div>
</div>
